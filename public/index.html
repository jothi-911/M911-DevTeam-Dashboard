<style>
/* Layout: dark module rail on the left, a ledger-like content column of panels on the right; stacks to a top bar on phones */
/* Layout: near-black module rail with the brand wordmark, content column of panels; magenta-to-cyan gradient from the logo is the only loud colour (primary actions, progress, login glow) */
:root{
  --bg:#0b0c14; --surface:#12131f; --surface-2:#161828; --sunken:#1e2036; --line:#25283f; --line-strong:#353a56;
  --fg:#e9eaf4; --muted:#9a9cb9; --faint:#6c6e8a;
  --accent:#a78bfa; --accent-hover:#c4b5fd; --accent-soft:#241d44; --on-accent:#ffffff;
  --good:#4ade80; --good-soft:#11301f; --warn:#fbbf24; --warn-soft:#33290f; --bad:#fb7185; --bad-soft:#3a1622; --info:#5ee3f0; --info-soft:#0f2f3a;
  --scrim:rgba(3,4,10,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 36px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(167,139,250,.25),0 8px 28px rgba(139,92,246,.25);
  --rail:#07080f; --rail-fg:#dcdcec; --rail-muted:#7d7f9e; --rail-active:#161830; --rail-line:#1a1c31; --rail-on:#5ee3f0;
  --magenta:#d62cf5; --violet:#8b7cf8; --cyan:#57e9f3;
  --grad:linear-gradient(120deg,#d62cf5 0%,#8b7cf8 55%,#57e9f3 100%);
  --paper:#ffffff; --paper-fg:#14152a; --paper-muted:#5b5d7b; --paper-line:#e2e2ef; --paper-soft:#f1ebfe; --paper-accent:#7c3aed; --paper-band:#0d0e1c;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
  --bg:#f4f4fa; --surface:#ffffff; --surface-2:#f8f8fd; --sunken:#ececf6; --line:#e2e2ef; --line-strong:#cbcbe0;
  --fg:#14152a; --muted:#5b5d7b; --faint:#8a8ca8;
  --accent:#7c3aed; --accent-hover:#6d28d9; --accent-soft:#efe8fe; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef3c7; --bad:#be123c; --bad-soft:#ffe4e6; --info:#0e7490; --info-soft:#cffafe;
  --scrim:rgba(14,15,32,.45);
  --shadow:0 1px 2px rgba(20,20,50,.06),0 10px 30px rgba(40,30,90,.12);
  --glow:0 0 0 1px rgba(124,58,237,.18),0 8px 24px rgba(124,58,237,.18);
  color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f4fa; --surface:#ffffff; --surface-2:#f8f8fd; --sunken:#ececf6; --line:#e2e2ef; --line-strong:#cbcbe0;
  --fg:#14152a; --muted:#5b5d7b; --faint:#8a8ca8;
  --accent:#7c3aed; --accent-hover:#6d28d9; --accent-soft:#efe8fe; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef3c7; --bad:#be123c; --bad-soft:#ffe4e6; --info:#0e7490; --info-soft:#cffafe;
  --scrim:rgba(14,15,32,.45);
  --shadow:0 1px 2px rgba(20,20,50,.06),0 10px 30px rgba(40,30,90,.12);
  --glow:0 0 0 1px rgba(124,58,237,.18),0 8px 24px rgba(124,58,237,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;padding:18px 12px 14px calc(12px + env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{color:var(--rail-muted);font-size:11px;display:block}
.logo-box{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--paper)}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-ph{background:transparent;border:1.5px dashed var(--rail-muted);color:var(--rail-muted);font-size:8.5px;font-weight:600;text-align:center;line-height:1.05;text-transform:uppercase;letter-spacing:.05em}
.navs{display:flex;flex-direction:column}
.nav-g{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.nav-g h4{padding:0 10px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--rail-muted);font-weight:600}
.nav-a{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;color:var(--rail-fg);cursor:pointer;text-align:left;font-size:13.5px;font-weight:500}
.nav-a:hover{background:var(--rail-active)}
.nav-a.on{background:var(--rail-active);color:var(--rail-on);box-shadow:inset 0 0 0 1px rgba(94,227,240,.18)}
.brand-word{display:block;width:150px;max-width:100%;height:auto}
.brand-wrap{padding:4px 8px 6px}
.brand-wrap small{display:block;color:var(--rail-muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;font-family:var(--f-mono)}
.rail{background-image:radial-gradient(120% 40% at 0% 0%,rgba(214,44,245,.10),transparent 60%),radial-gradient(120% 30% at 100% 100%,rgba(87,233,243,.08),transparent 60%)}
.login-side{background-image:radial-gradient(70% 55% at 10% 0%,rgba(214,44,245,.22),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(87,233,243,.18),transparent 70%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:auto,auto,28px 28px,28px 28px}
.login-word{width:240px;max-width:70%;height:auto;display:block}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ps-word{height:40px;width:auto;display:block}
.logo-big.word{width:220px;height:110px;padding:10px}
.logo-big.word.on-dark{background:var(--paper-band)}
.nav-a .cnt{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--rail-line);padding:1px 6px;border-radius:99px;color:var(--rail-fg)}
.me{margin-top:auto;padding:14px 6px 0;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:10px}
.me-txt{min-width:0;flex:1}
.me-txt b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-txt small{color:var(--rail-muted);font-size:11.5px}
.rail-btn{border:1px solid var(--rail-line);background:none;color:var(--rail-fg);border-radius:6px;padding:6px;cursor:pointer;display:grid;place-items:center}
.rail-btn:hover{background:var(--rail-active)}
.main{min-width:0}
.page{max-width:1280px;margin:0 auto;padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.proto-bar{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto-bar .pill{font-weight:600}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:26px;line-height:1.15}
.ph p{color:var(--muted);margin-top:4px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;border:0;background:none;padding:0;cursor:pointer;margin-bottom:6px;font-weight:500}
.crumb:hover{color:var(--fg)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px}
.panel-h .sub{font-size:12.5px;color:var(--muted);font-family:var(--f-body)}
.panel-b{padding:16px}
.panel-b.flush{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1100px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .k-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-size:25px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.bad .k-v{color:var(--bad)} .kpi.warn .k-v{color:var(--warn)} .kpi.good .k-v{color:var(--good)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.tbl th.r{font-family:var(--f-body)}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line-strong)}
.tbl .nowrap{white-space:nowrap}
.tbl.terms input{width:100%;text-align:left;font-family:var(--f-body)}
.tbl.terms input[type=number]{width:84px;text-align:right;font-family:var(--f-mono)}
.tbl input{width:84px;padding:5px 7px;text-align:right;font-family:var(--f-mono);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ---------- small parts ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--sunken);color:var(--muted);font-size:11.5px;font-family:var(--f-mono);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--grad);border-color:transparent;color:#ffffff;box-shadow:var(--glow)}
.btn.pri:hover{background:var(--grad);filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--fg);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent);text-decoration:underline}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunken);border-radius:7px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);min-width:0}
.prog{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;min-width:70px;flex:1}
.prog i{display:block;height:100%;background:var(--grad);border-radius:inherit}
.prog-row{display:flex;align-items:center;gap:8px;min-width:120px}
.prog-row span{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:34px;text-align:right}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none;letter-spacing:.02em}
.av.sm{width:22px;height:22px;font-size:9px}
.av.lg{width:58px;height:58px;font-size:19px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{display:block;font-weight:600}
.person small{color:var(--muted);font-size:12px}
.avs{display:flex}
.avs .av{border:2px solid var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600}
.li .grow small{color:var(--muted);font-size:12.5px}
.dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:9px 16px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.note{font-size:12.5px;color:var(--muted)}
.tag-good{color:var(--good)} .tag-bad{color:var(--bad)} .tag-warn{color:var(--warn)}
.feed{display:flex;flex-direction:column}
.feed .li{align-items:flex-start}
.feed p{margin-top:3px;color:var(--fg)}
.check{display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.hbar{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .t{height:10px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--grad)}
.hbar .v{text-align:right;font-family:var(--f-mono);font-size:12.5px}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:2px 4px 4px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.tcard.prio-high{box-shadow:inset 3px 0 0 var(--bad)}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.prio{font-size:11px;font-weight:600;color:var(--muted)}
.prio-high .prio{color:var(--bad)}
.tc-title{border:0;background:none;padding:0;text-align:left;font-weight:600;cursor:pointer;line-height:1.35}
.tc-title:hover{color:var(--accent)}
.tc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tc-meta .bad{color:var(--bad);font-weight:600}
.tc-foot{display:flex;align-items:center;gap:7px}
.tc-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select.mini{font-size:12px;padding:3px 6px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface)}

/* ---------- gantt ---------- */
.gantt{overflow-x:auto}
.g-in{min-width:780px;position:relative}
.g-head,.g-row{display:grid;grid-template-columns:230px 1fr}
.g-head{height:30px;border-bottom:1px solid var(--line)}
.g-scale{position:relative}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-tick span{position:absolute;left:6px;top:7px;font-size:11px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.g-body{position:relative}
.g-lines{position:absolute;top:0;bottom:0;left:230px;right:0;pointer-events:none}
.g-lines .g-tick{border-left:1px dashed var(--line)}
.g-today{position:absolute;top:-30px;bottom:0;border-left:2px solid var(--bad);z-index:2}
.g-today span{position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.g-row{min-height:46px;border-bottom:1px solid var(--line);align-items:center}
.g-row:last-child{border-bottom:0}
.g-label{padding:6px 14px 6px 16px;min-width:0}
.g-label b,.g-label .linkbtn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:13px}
.g-label small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:46px}
.g-bar{position:absolute;top:14px;height:18px;border-radius:5px;background:var(--accent-soft);overflow:hidden;z-index:1;border:1px solid var(--accent)}
.g-bar i{display:block;height:100%;background:var(--accent);opacity:.85}
.g-bar.t-info{background:var(--info-soft);border-color:var(--info)} .g-bar.t-info i{background:var(--info)}
.g-bar.t-warn{background:var(--warn-soft);border-color:var(--warn)} .g-bar.t-warn i{background:var(--warn)}
.g-bar.t-bad{background:var(--bad-soft);border-color:var(--bad)} .g-bar.t-bad i{background:var(--bad)}
.g-bar.t-muted{background:var(--sunken);border-color:var(--line-strong)} .g-bar.t-muted i{background:var(--faint)}
.g-ms{position:absolute;top:17px;width:11px;height:11px;margin-left:-5px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--fg);z-index:3}
.g-ms.done{background:var(--fg)}
.g-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.g-legend span{display:inline-flex;align-items:center;gap:6px}
.g-legend i{width:12px;height:10px;border-radius:3px;display:inline-block;border:1px solid}

/* ---------- charts ---------- */
.chart svg{width:100%;height:auto;display:block}
.c-a{fill:var(--accent)} .c-b{fill:var(--line-strong)} .c-bad{fill:var(--bad)}
.c-grid{stroke:var(--line);stroke-width:1}
.c-t{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.c-tl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#overlay.as-drawer{justify-content:flex-end;padding:0}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:580px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:900px}
.drawer{background:var(--surface);width:min(540px,100%);min-height:100%;border-left:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:17px}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.icon-btn{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{resize:vertical}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-weight:600;font-size:13.5px;padding-top:12px;border-top:1px solid var(--line)}
.fsec:first-child{padding-top:0;border-top:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form .inp{flex:1;min-width:140px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;transition:opacity .2s,transform .2s;z-index:70;font-weight:500;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.login-side{background:var(--rail);color:var(--rail-fg);padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;gap:28px}
.login-side h1{font-size:40px;line-height:1.08;max-width:15ch;color:var(--rail-fg);letter-spacing:-.03em}
.login-side p{color:var(--rail-muted);max-width:44ch;font-size:15px}
.login-side ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;max-width:46ch}
.login-side li{display:flex;gap:10px;color:var(--rail-fg)}
.login-side li b{color:var(--rail-on);font-family:var(--f-mono);font-weight:500;font-size:12px;padding-top:2px;min-width:72px}
.login-main{padding-block:48px;padding-left:48px;padding-right:max(48px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:520px;width:100%;margin:0 auto}
.login-card{display:flex;flex-direction:column;gap:14px}
.login-card h2{font-size:24px}
.err{color:var(--bad);font-size:13px}
.demo{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.demo h3{font-size:14px}
.demo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-btn{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.demo-btn:hover{border-color:var(--accent)}
.demo-btn b{display:block;font-size:13px}
.demo-btn small{color:var(--muted);font-size:12px}
code{font-family:var(--f-mono);background:var(--sunken);padding:1px 6px;border-radius:4px;font-size:12.5px}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-side{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .login-side h1{font-size:30px}
  .login-main{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}
@media (max-width:420px){.demo-grid{grid-template-columns:1fr}}

/* ---------- payslip / document preview ---------- */
.ps{background:var(--paper);color:var(--paper-fg);border:1px solid var(--line);border-radius:6px;padding:26px;font-size:12.5px;overflow-x:auto}
.ps-in{min-width:520px;display:flex;flex-direction:column;gap:16px}
.ps-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.ps-co{display:flex;gap:12px;align-items:center}
.ps-logo{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;overflow:hidden;flex:none;border:1.5px dashed var(--paper-line);color:var(--paper-muted);font-size:8px;text-align:center;text-transform:uppercase;font-weight:700;letter-spacing:.04em;background:var(--paper)}
.ps-logo.has{border:0}
.ps-logo img{width:100%;height:100%;object-fit:contain}
.ps-co b{font-size:15px;display:block;font-family:var(--f-display)}
.ps-co small{color:var(--paper-muted);white-space:pre-line;display:block;font-size:11px}
.ps-title{text-align:right}
.ps-title b{display:block;font-family:var(--f-display);font-size:17px;color:var(--paper-accent)}
.ps-title small{color:var(--paper-muted)}
.ps-det{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.ps-det div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--paper-line)}
.ps-det span{color:var(--paper-muted)}
.ps-tbls{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ps table{width:100%;border-collapse:collapse}
.ps th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:7px 8px;background:var(--paper-soft);color:var(--paper-fg)}
.ps td{padding:6px 8px;border-bottom:1px solid var(--paper-line)}
.ps td.r,.ps th.r{text-align:right;font-family:var(--f-mono)}
.ps tr.tot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--paper-fg)}
.ps-net{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper-soft);padding:12px 14px;border-radius:6px}
.ps-net b{font-size:20px;font-family:var(--f-mono)}
.ps-net small{display:block;color:var(--paper-muted)}
.ps-foot{color:var(--paper-muted);font-size:10.5px;text-align:center}
.ps.tpl-modern{padding:0}
.ps.tpl-modern .ps-in{padding:0 26px 26px}
.ps.tpl-modern .ps-head{background:var(--paper-band);color:var(--paper);margin:0 -26px;padding:20px 26px}

.topline{display:flex;justify-content:flex-end;margin-bottom:-8px}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const brandOnly=()=>!C().logo&&!!C().brand;
const STAGES=['On Discussion','Proposal Sent','PO Expected','PO Received','Delivered','Lost'];
const OPEN_STAGES=['On Discussion','Proposal Sent','PO Expected'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=s=>new Date(s+'T00:00:00');
const z2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((D(a)-D(b))/86400000);
const fmtD=s=>{if(!s)return '—';const d=D(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const fmtDs=s=>{if(!s)return '—';const d=D(s);return d.getDate()+' '+MON[d.getMonth()];};
const monthLabel=k=>MONL[+k.slice(5,7)-1]+' '+k.slice(0,4);
const monthShort=k=>MON[+k.slice(5,7)-1]+' '+k.slice(2,4);
const monthEnd=k=>{const d=D(k+'-01');d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d);};
const addMonths=(k,n)=>{const d=D(k+'-01');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7);};
const inr=n=>(n<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const inrP=n=>(n<0?'-':'')+'Rs. '+Math.abs(Math.round(n)).toLocaleString('en-IN');
const shortInr=n=>{const a=Math.abs(n);const s=a>=1e7?(a/1e7).toFixed(1).replace(/\.0$/,'')+'Cr':a>=1e5?(a/1e5).toFixed(1).replace(/\.0$/,'')+'L':a>=1e3?Math.round(a/1e3)+'k':String(Math.round(a));return (n<0?'−':'')+'₹'+s;};
const hrs=n=>(Math.round(n*10)/10).toString();
const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function barChart(labels,series,{h=220}={}){
  const W=640,H=h,L=58,R=10,T=12,B=28;const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(m=>m*step).find(v=>v*4>=max)||step*10;const top=nice*4;
  const y=v=>T+(H-T-B)*(1-v/top);const gw=(W-L-R)/labels.length;const bw=Math.min(22,(gw-14)/series.length);
  let g='';for(let i=0;i<=4;i++){const v=nice*i;g+=`<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-t" x="${L-8}" y="${y(v)+4}" text-anchor="end">${shortInr(v)}</text>`;}
  let bars='';labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;const x0=cx-bw*series.length/2;series.forEach((s,j)=>{const v=s.values[i];bars+=`<rect class="${s.cls}" x="${x0+j*bw+1}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" rx="2"><title>${esc(s.name)} – ${esc(lb)}: ${inr(v)}</title></rect>`;});bars+=`<text class="c-tl" x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;});
  const legend=`<div class="legend">${series.map(s=>`<span><i class="lg-${s.cls}" style="background:var(${s.cls==='c-a'?'--accent':s.cls==='c-bad'?'--bad':'--line-strong'})"></i>${esc(s.name)}</span>`).join('')}</div>`;
  return `<div class="chart">${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}${bars}</svg></div>`;
}
function gantt(items,from,to,legend=''){
  const span=diffDays(to,from)+1;const pos=d=>Math.max(0,Math.min(100,diffDays(d,from)/span*100));
  let ticks='';const m=D(from);m.setDate(1);
  const weekly=span<=100;
  if(weekly){let d=from;const w=(D(d).getDay()+6)%7;d=addDays(d,(7-w)%7);for(;d<=to;d=addDays(d,7))ticks+=`<div class="g-tick" style="left:${pos(d)}%"><span>${fmtDs(d)}</span></div>`;}
  else{while(iso(m)<=to){const s=iso(m);if(s>=from)ticks+=`<div class="g-tick" style="left:${pos(s)}%"><span>${MON[m.getMonth()]}${m.getMonth()===0?" '"+String(m.getFullYear()).slice(2):''}</span></div>`;m.setMonth(m.getMonth()+1);}}
  const today=TODAY>=from&&TODAY<=to?`<div class="g-today" style="left:${pos(TODAY)}%"><span>Today</span></div>`:'';
  const rows=items.map(it=>{const s=it.start<from?from:it.start,e=it.end>to?to:it.end;const l=pos(s),r=pos(addDays(e,1));
    const bar=it.end<from||it.start>to?'':`<div class="g-bar t-${it.tone||'accent'}" style="left:${l}%;width:${Math.max(.8,r-l)}%" title="${esc(it.title||it.label)}: ${fmtD(it.start)} – ${fmtD(it.end)}"><i style="width:${it.progress||0}%"></i></div>`;
    const ms=(it.markers||[]).filter(k=>k.date>=from&&k.date<=to).map(k=>`<div class="g-ms ${k.done?'done':''}" style="left:${pos(k.date)}%" title="${esc(k.label)} – ${fmtD(k.date)}"></div>`).join('');
    return `<div class="g-row"><div class="g-label">${it.labelHtml||`<b>${esc(it.label)}</b>`}<small>${it.sub||''}</small></div><div class="g-track">${bar}${ms}</div></div>`;}).join('');
  return `<div class="gantt"><div class="g-in"><div class="g-head"><div></div><div class="g-scale">${ticks}</div></div><div class="g-body"><div class="g-lines">${ticks}${today}</div>${rows||'<div class="empty">Nothing to show in this range.</div>'}</div></div></div>${legend}`;
}

function reportRange(){const p=S.ui.rp||'week',d=S.ui.rd||LASTWORK;
  if(p==='day')return{p,from:d,to:d,label:fmtD(d)};
  if(p==='week'){const r=weekRange(d);return{p,...r,label:`${fmtDs(r.from)} – ${fmtD(r.to)}`};}
  const from=d.slice(0,7)+'-01';return{p,from,to:monthEnd(d.slice(0,7)),label:monthLabel(d.slice(0,7))};}
function reportData(){
  const r=reportRange();const team=scopeEmployees().filter(e=>!(U().role==='admin'&&e.isOwner));const wd=Math.max(1,weekdays(r.from,r.to<LASTWORK?r.to:LASTWORK));
  const rows=team.map(e=>{const done=DB.tasks.filter(t=>t.assignee===e.id&&t.completedOn&&t.completedOn>=r.from&&t.completedOn<=r.to);const h=sum(timeRows().filter(l=>l.e===e.id&&l.d>=r.from&&l.d<=r.to),l=>l.h);
    const prog=DB.tasks.filter(t=>t.assignee===e.id&&(t.status==='In progress'||t.status==='Review')).length;const od=DB.tasks.filter(t=>t.assignee===e.id&&isOverdue(t)).length;
    const up=DB.updates.filter(x=>x.emp===e.id&&x.date>=r.from&&x.date<=r.to).length;
    return{e,done,h,prog,od,up,util:Math.round(h/(wd*8)*100)};});
  const projs=visibleProjects().filter(p=>p.status!=='Completed').map(p=>{const ts=DB.tasks.filter(t=>t.projectId===p.id);return{p,done:ts.filter(t=>t.completedOn&&t.completedOn>=r.from&&t.completedOn<=r.to).length,h:sum(timeRows().filter(l=>l.d>=r.from&&l.d<=r.to&&l.p===p.id),l=>l.h),od:ts.filter(isOverdue).length,prog:progress(p),health:health(p)};});
  return{r,rows,projs,wd};
}

const TPLS=[['modern','Modern','Colour header band'],['classic','Classic','Bordered, formal'],['compact','Compact','Minimal, one page']];

function words(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?'-'+a[x%10]:'');const three=x=>x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
  n=Math.round(n);if(n<=0)return 'Zero';const out=[];const cr=Math.floor(n/1e7);n%=1e7;const la=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+' Crore');if(la)out.push(two(la)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));return out.join(' ');
}

const TERMS=[['40-30-30','Advance 40% · 2nd payment 30% · Final 30%'],['40-40-20','Advance 40% · 2nd payment 40% · Final 20%'],['50-50','Advance 50% · Final 50%'],['30-40-30','Advance 30% · 2nd payment 40% · Final 30%'],['100','100% on delivery'],['monthly','Monthly retainer'],['custom','Custom']];
const MODES=['Bank transfer','UPI','Cheque','Cash'];
function termRows(preset,start,end){
  if(end<start)end=start;const mid=addDays(start,Math.round(diffDays(end,start)/2));
  if(preset==='50-50')return[['Advance',50,start],['Final payment',50,end]];
  if(preset==='40-40-20')return[['Advance',40,start],['2nd payment',40,mid],['Final payment',20,end]];
  if(preset==='30-40-30')return[['Advance',30,start],['2nd payment',40,mid],['Final payment',30,end]];
  if(preset==='100')return[['Payment on delivery',100,end]];
  if(preset==='monthly'){const ms=[];for(let m=start.slice(0,7);m<=end.slice(0,7);m=addMonths(m,1))ms.push(m);const n=ms.length||1;const base=Math.floor(10000/n)/100;return ms.map((m,i)=>{let d=m+'-'+start.slice(8);if(d>monthEnd(m))d=monthEnd(m);return['Retainer – '+monthLabel(m),i===n-1?+(100-base*(n-1)).toFixed(2):base,d];});}
  return[['Advance',40,start],['2nd payment',30,mid],['Final payment',30,end]];
}
function splitAmounts(value,pcts){const out=pcts.map(x=>Math.round(value*x/100));if(out.length&&Math.abs(sum(pcts)-100)<0.01)out[out.length-1]+=value-sum(out);return out;}

  const byCat=COSTCAT.map(c=>[c,sum(q.costs.filter(x=>x.cat===c),x=>(+x.qty||0)*(+x.unit||0))]).filter(x=>x[1]);
  return{labour,other,base,cont,cost,price,profit,margin:price?profit/price*100:0,markup:cost?profit/cost*100:0,floor:cost?roundUp(cost/(1-MIN_MARGIN/100)):0,byCat};}

function projProfit(p){const rev=projFin(p).total;const q=p.estimateId&&estById(p.estimateId);const estCost=q?estCalc(q).cost:(p.budget||0);
  const tids=new Set(DB.tasks.filter(t=>t.projectId===p.id).map(t=>t.id));const labour=Math.round(sum(timeRows().filter(l=>l.p===p.id||(l.src==='log'&&tids.has(l.t))),l=>l.h/8*rateFor(emp(l.e)?.designationId)));
  const exps=DB.expenses.filter(x=>x.projectId===p.id);const exp=sum(exps,x=>x.amount);const act=labour+exp;
  return{rev,hasEst:!!(q||p.budget),estCost,estProfit:rev-estCost,estMargin:rev?(rev-estCost)/rev*100:0,labour,exp,exps,act,actProfit:rev-act,actMargin:rev?(rev-act)/rev*100:0,used:estCost?act/estCost*100:0,q};}

const COLLS=['designations','employees','clients','projects','tasks','leaves','expenses','advances','updates','logs','pipeline','events','estimates','timesheets'];
let SNAP=null,VERSION=0,ME=null,USERS=null,FLUSH_T=null,INFLIGHT=null,SYNC='saved',POLL_T=null;
async function api(path,data,opt={}){
  const r=await fetch(path,{method:opt.method||(data!==undefined?'POST':'GET'),headers:data!==undefined&&!opt.raw?{'content-type':'application/json'}:(opt.type?{'content-type':opt.type}:{}),body:opt.raw||(data!==undefined?JSON.stringify(data):undefined),credentials:'same-origin'});
  const ct=r.headers.get('content-type')||'';const body=ct.includes('json')?await r.json().catch(()=>({})):await r.blob();
  if(r.status===401&&!opt.allow401){onSignedOut();throw Object.assign(new Error((body&&body.error)||'Please sign in.'),{status:401});}
  if(!r.ok)throw Object.assign(new Error((body&&body.error)||('Error '+r.status)),{status:r.status,body});
  return body;
}
function snapOf(db){const s={c:{},s:{}};for(const [k,v] of Object.entries(db)){if(COLLS.includes(k)&&Array.isArray(v)){const m={};v.forEach(x=>{if(x&&x.id!=null)m[x.id]=JSON.stringify(x);});s.c[k]=m;}else s.s[k]=JSON.stringify(v===undefined?null:v);}return s;}
function diffSnap(a,b){const changes=[],singles=[];
  for(const k of new Set([...Object.keys(a.c),...Object.keys(b.c)])){const A=a.c[k]||{},B=b.c[k]||{};
    for(const id in B)if(A[id]!==B[id])changes.push({c:k,id,op:'upsert',d:JSON.parse(B[id])});
    for(const id in A)if(!(id in B))changes.push({c:k,id,op:'delete'});}
  for(const k of new Set([...Object.keys(a.s),...Object.keys(b.s)]))if(a.s[k]!==b.s[k])singles.push({k,d:b.s[k]===undefined?null:JSON.parse(b.s[k])});
  return{changes,singles};}
function setSync(st){SYNC=st;const el=document.getElementById('sync');if(el){el.className='sync s-'+st;el.textContent=st==='saving'?'Saving…':st==='error'?'Not saved – retrying':st==='offline'?'Offline – will retry':'All changes saved';}}
function save(){if(!SNAP)return;clearTimeout(FLUSH_T);FLUSH_T=setTimeout(flush,350);setSync('saving');}
function saveSession(){}
async function flush(){
  if(INFLIGHT||!SNAP)return;const cur=snapOf(DB);const{changes,singles}=diffSnap(SNAP,cur);
  if(!changes.length&&!singles.length){setSync('saved');return;}
  INFLIGHT=api('/api/changes',{changes,singles}).then(r=>{
    SNAP=cur;VERSION=r.version;INFLIGHT=null;
    if(r.rejected&&r.rejected.length){toast(r.rejected[0].why||'Some changes were not allowed.');return loadData();}
    const again=diffSnap(SNAP,snapOf(DB));if(again.changes.length||again.singles.length)flush();else setSync('saved');
  }).catch(e=>{INFLIGHT=null;if(e.status===401)return;setSync(navigator.onLine===false?'offline':'error');clearTimeout(FLUSH_T);FLUSH_T=setTimeout(flush,5000);});
  return INFLIGHT;
}

/* ================= timesheet ================= */
const TS_DEFAULT={slots:[{from:'10:00',to:'12:00'},{from:'12:00',to:'14:00'},{from:'15:00',to:'17:00'},{from:'17:00',to:'19:00'}],editDays:7,start:'2026-10-26'};
const TS_ACT=[['@internal','Internal work (no project)'],['@meeting','Meeting / client call'],['@presales','Proposal / pre-sales'],['@learning','Learning / R&D'],['@idle','No work assigned'],['@break','Break / personal'],['@leave','Leave / off']];
const TS_OFF=new Set(['@break','@leave']);
const tsCfg=()=>{const c=DB.tsconfig;return c&&Array.isArray(c.slots)&&c.slots.length?{...TS_DEFAULT,...c}:TS_DEFAULT;};
const tmin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0);};
const slotLen=s=>Math.max(0,(tmin(s.to)-tmin(s.from))/60);
const t12=t=>{const m=tmin(t),h=Math.floor(m/60),mm=m%60;const h12=h%12||12;return h12+(mm?':'+z2(mm):'')+(h<12?' am':' pm');};
const slotLabel=s=>`${t12(s.from)} – ${t12(s.to)}`;
const tsWhat=p=>{if(!p)return '';if(p[0]==='@')return (TS_ACT.find(a=>a[0]===p)||[p,'Other work'])[1];const x=proj(p);return x?x.name:'(deleted project)';};
const tsId=(e,d)=>`TS-${e}-${d}`;
const tsRec=(e,d)=>(DB.timesheets||[]).find(r=>r.e===e&&r.d===d);
const tsStart=()=>tsCfg().start||TS_DEFAULT.start;
const tsDayLen=()=>sum(tsCfg().slots,slotLen);
function tsLinesOf(r){const out=[];(r.slots||[]).forEach((s,i)=>(s.lines||[]).forEach((l,j)=>out.push({p:l.p||'',t:l.t||'',h:+l.h||0,w:l.w||'',si:i,li:j,s:s.from?slotLabel(s):'',e:r.e,d:r.d})));return out;}
function tsAll(){return (DB.timesheets||[]).flatMap(tsLinesOf).filter(l=>l.p&&l.h>0);}
const tsWork=l=>!TS_OFF.has(l.p);
// every hour of work, from timesheets and from older "log time" entries on tasks
function timeRows(){const ts=tsAll().filter(tsWork).map(l=>({...l,src:'ts'}));
  const lg=(DB.logs||[]).map(l=>({e:l.e,d:l.d,t:l.t||'',p:(l.t&&task(l.t)?.projectId)||'',h:+l.h||0,w:'',src:'log'}));return lg.concat(ts);}
const tsHours=r=>r?sum(tsLinesOf(r).filter(l=>l.p&&tsWork(l)),l=>l.h):0;
const slotDone=s=>(s.lines||[]).some(l=>l.p&&String(l.w||'').trim()&&+l.h>0)||(s.lines||[]).some(l=>TS_OFF.has(l.p)&&+l.h>0);
function tsCanEdit(e,d){const u=U();if(u.role==='admin')return true;if(e!==u.id||d>TODAY)return false;return d>=addDays(TODAY,-(+tsCfg().editDays||7));}
function onLeave(e,d){return DB.leaves.find(l=>l.emp===e&&l.status==='Approved'&&l.from<=d&&l.to>=d);}
const holidayOn=d=>DB.holidays.find(h=>h.date===d);
const isWorkday=d=>{const w=D(d).getDay();return w>0&&w<6&&!holidayOn(d);};
// day state for one person: done / part / missing / leave / holiday / off / future
function tsState(e,d){const r=tsRec(e,d);const h=tsHours(r);const lv=onLeave(e,d);const per=emp(e);
  if(per&&per.joinDate&&d<per.joinDate)return{k:'off',h};
  if(r&&(r.slots||[]).length&&r.slots.every(slotDone))return{k:h>0?'done':'leave',h};
  if(lv)return{k:'leave',h,lv};
  if(!isWorkday(d))return{k:h>0?'part':holidayOn(d)?'holiday':'off',h};
  if(d>TODAY)return{k:'future',h};
  if(d<tsStart())return{k:h>0?'part':'off',h};
  if(h>0||(r&&tsLinesOf(r).some(l=>l.p||l.w)))return{k:'part',h};
  return{k:d===TODAY?'today':'missing',h};}
const TS_TONE={done:'good',part:'warn',missing:'bad',leave:'info',holiday:'',off:'',future:'',today:''};
const tsPeople=()=>{const u=U();return [u,...scopeEmployees().filter(e=>e.id!==u.id)].filter(e=>e&&e.status!=='Exited');};
// people expected to fill timesheets (the Admin only once they start using it)
const tsTeamPeople=()=>tsPeople().filter(e=>e.role!=='admin'||(DB.timesheets||[]).some(r=>r.e===e.id));
function tsTemplate(){return tsCfg().slots.map(s=>({from:s.from,to:s.to,lines:[{p:'',t:'',h:slotLen(s),w:''}]}));}
function tsEnsure(e,d){let r=tsRec(e,d);if(!r){r={id:tsId(e,d),e,d,slots:tsTemplate(),at:new Date().toISOString()};DB.timesheets=DB.timesheets||[];DB.timesheets.push(r);}return r;}
function tsTouch(r){r.at=new Date().toISOString();r.by=U().id;}
const tsHourOpts=max=>{const o=[];for(let h=0.5;h<=max+1e-9;h+=0.5)o.push([String(h),hrs(h)+' h']);return o;};
const weekOf=d=>weekRange(d);

/* ---------- page ---------- */
function pgTimesheet(){
  const u=U();const mgr=canManage();
  const tab=S.ui.tst||'day';const tl=[['day',mgr?'Day sheet':'My timesheet'],...(mgr?[['team','Team week']]:[]),['summary','Hours summary']];
  let body='';
  if(tab==='team'&&mgr)body=tsTeamView();else if(tab==='summary')body=tsSummaryView();else body=tsDayView();
  return pageHead('Timesheet',`What everyone worked on, slot by slot · ${tsCfg().slots.map(slotLabel).join(' · ')}`,`<button class="btn" data-act="dl" data-what="timesheet" data-fmt="csv">${ico('download')}Excel (CSV)</button><button class="btn" data-act="dl" data-what="timesheet" data-fmt="pdf">${ico('download')}PDF</button>`)+tabs('tst',tl,tab)+body;
}
function tsDayView(){
  const u=U();const people=tsPeople();let who=S.ui.tse&&people.some(e=>e.id===S.ui.tse)?S.ui.tse:u.id;const d=S.ui.tsd||TODAY;const p=emp(who);
  const ed=tsCanEdit(who,d);const r=tsRec(who,d);const slots=r?r.slots:tsTemplate();
  const wk=weekOf(d);const days=[];for(let x=wk.from;x<=wk.to;x=addDays(x,1))days.push(x);
  const strip=`<div class="ts-week">${days.map(x=>{const st=tsState(who,x);const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][D(x).getDay()];
    return `<button class="ts-dayb ${x===d?'on':''} st-${st.k}" data-act="tsDay" data-val="${x}"><b>${dn} ${D(x).getDate()}</b><small>${st.k==='leave'?'Leave':st.k==='holiday'?'Holiday':st.h?hrs(st.h)+' h':st.k==='missing'?'Missing':'—'}</small></button>`;}).join('')}</div>`;
  const selP=people.length>1?`<select data-chg="setui" data-key="tse" id="ts-person" aria-label="Person">${opts(people.map(e=>[e.id,e.id===u.id?e.name+' (me)':e.name]),who)}</select>`:'';
  const nav=`<div class="toolbar">${selP}<button class="btn sm" data-act="tsDay" data-val="${addDays(d,-1)}" aria-label="Previous day">‹</button><input type="date" class="inp" style="flex:0 0 160px" value="${d}" data-chg="tsDate" id="ts-date" aria-label="Date"><button class="btn sm" data-act="tsDay" data-val="${addDays(d,1)}" aria-label="Next day">›</button>${d!==TODAY?`<button class="btn sm" data-act="tsDay" data-val="${TODAY}">Today</button>`:''}</div>`;
  const lv=onLeave(who,d),hol=holidayOn(d);
  const notes=[lv?`${esc(p.name.split(' ')[0])} is on ${LTYPES[lv.type]||'leave'} this day.`:'',hol?`Public holiday: ${esc(hol.name)}.`:'',!isWorkday(d)&&!hol?'Weekend. Fill it in only if you worked.':'',
    !ed?(who!==u.id?`View only. Only ${esc(p.name.split(' ')[0])}${u.role==='admin'?'':' and the Admin'} can change this sheet.`:d>TODAY?'You can’t fill in future days.':`This day is locked. Sheets can be changed for ${tsCfg().editDays} days; ask the Admin to correct it.`):''].filter(Boolean);
  const myProj=(who===u.id?visibleProjects():visibleProjects().filter(x=>x.managerId===who||x.team.includes(who)));
  const cards=slots.map((s,si)=>{const len=slotLen(s);const lines=s.lines||[];const used=sum(lines,l=>+l.h||0);const done=slotDone(s);
    const lineHtml=lines.map((l,li)=>{const k=`${si}-${li}`;const isP=l.p&&l.p[0]!=='@';
      if(!ed)return `<div class="ts-line ro"><div class="ts-lh"><b>${l.p?esc(tsWhat(l.p)):'<span class="muted">Not filled</span>'}</b>${l.t&&task(l.t)?`<span class="note"> · ${esc(task(l.t).title)}</span>`:''}<span class="chip" style="margin-left:auto">${hrs(+l.h||0)} h</span></div>${l.w?`<p>${esc(l.w)}</p>`:''}</div>`;
      const pList=myProj.filter(x=>x.status!=='Completed'||x.id===l.p);if(isP&&!pList.some(x=>x.id===l.p)&&proj(l.p))pList.push(proj(l.p));
      const tList=isP?DB.tasks.filter(t=>t.projectId===l.p&&(t.status!=='Done'||t.id===l.t||(t.completedOn||'')>=addDays(d,-14))).sort((a,b)=>(b.assignee===who)-(a.assignee===who)||a.title.localeCompare(b.title)):[];
      return `<div class="ts-line"><div class="ts-lh">
        <select class="inp ts-p" data-chg="tsP" data-si="${si}" data-li="${li}" id="tsp-${k}" aria-label="Project or activity"><option value="">Choose project or activity…</option>${pList.length?`<optgroup label="Projects">${opts(pList.map(x=>[x.id,x.name]),l.p)}</optgroup>`:''}<optgroup label="Other work">${opts(TS_ACT,l.p)}</optgroup></select>
        ${lines.length>1||len!==+l.h?`<select class="inp ts-h" data-chg="tsH" data-si="${si}" data-li="${li}" id="tsh-${k}" aria-label="Hours">${opts(tsHourOpts(len),String(+l.h||0))}</select>`:`<span class="chip">${hrs(len)} h</span>`}
        ${lines.length>1?`<button class="icon-btn" data-act="tsDelLine" data-si="${si}" data-li="${li}" aria-label="Remove this line" title="Remove">×</button>`:''}</div>
        ${tList.length?`<select class="inp ts-t" data-chg="tsT" data-si="${si}" data-li="${li}" id="tst-${k}" aria-label="Task"><option value="">Task (optional)</option>${opts(tList.map(t=>[t.id,t.title+(t.assignee!==who?' · '+(emp(t.assignee)?.name||'').split(' ')[0]:'')]),l.t)}</select>`:''}
        <textarea class="inp ts-w" rows="2" data-inp="tsW" data-si="${si}" data-li="${li}" id="tsw-${k}" placeholder="What did you work on? e.g. Modelled the booth walls, fixed lighting" aria-label="What did you work on">${esc(l.w||'')}</textarea></div>`;}).join('');
    return `<section class="ts-slot ${done?'done':''}" id="tss-${si}"><div class="ts-sh"><div><b>${slotLabel(s)}</b><small>${hrs(len)} hours</small></div><span class="pill ${done?'good':''}" id="tsst-${si}">${done?'Done':used&&lines.some(l=>l.p)?'In progress':'Empty'}</span></div>${lineHtml}
      ${ed?`<div class="toolbar" style="margin-top:8px">${lines.length<4&&len>=1?`<button class="btn sm" data-act="tsAddLine" data-si="${si}">+ Split with another project</button>`:''}${si>0?`<button class="btn sm" data-act="tsCopyPrev" data-si="${si}">Same as previous slot</button>`:''}</div>`:''}</section>`;}).join('');

/* ================= downloads ================= */
async function saveFile(name,data){
  const type=/\.csv$/.test(name)?'text/csv':/\.json$/.test(name)?'application/json':/\.pdf$/.test(name)?'application/pdf':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Downloaded '+name);
}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function saveCsv(name,head,rows){saveFile(name,'﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'));}
function pdfDoc(orient='p'){if(!window.jspdf){toast('The PDF tool did not load. Check your connection and reload.');throw new Error('jsPDF missing');}return new window.jspdf.jsPDF({orientation:orient,unit:'pt',format:'a4'});}
function savePdf(doc,name){const n=doc.getNumberOfPages();const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(138,146,139);doc.text(`${C().name} · generated ${fmtD(TODAY)}`,40,H-22);doc.text(`Page ${i} of ${n}`,W-40,H-22,{align:'right'});}saveFile(name,doc.output('blob'));}
function addLogo(doc,x,y,s,onDark=false){const c=C();if(c.logo){try{doc.addImage(c.logo,'PNG',x,y,s,s);return s;}catch(e){}}if(c.brand){const w=s*560/268;try{doc.addImage(onDark?BRAND.white:BRAND.dark,'PNG',x,y,w,s);return w;}catch(e){}}doc.setDrawColor(196,201,191);doc.setLineDashPattern([3,2],0);doc.roundedRect(x,y,s,s,4,4);doc.setLineDashPattern([],0);doc.setFontSize(6.5);doc.setTextColor(138,146,139);doc.text('YOUR',x+s/2,y+s/2-1,{align:'center'});doc.text('LOGO',x+s/2,y+s/2+7,{align:'center'});return s;}
function pdfHeader(doc,title,sub){const W=doc.internal.pageSize.getWidth();const lw=addLogo(doc,40,30,40);const tx=40+lw+14;if(!brandOnly()){doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(20,21,42);doc.text(C().name,tx,46);}doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(91,93,123);doc.text(C().address.replace(/\n/g,', '),tx,brandOnly()?53:60,{maxWidth:W-tx-40});doc.setDrawColor(124,58,237);doc.setLineWidth(1.2);doc.line(40,82,W-40,82);doc.setLineWidth(.5);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(124,58,237);doc.text(title,40,106);if(sub){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(91,100,93);doc.text(sub,40,121);}return 138;}
function pdfCell(doc,t,x,y,w,al){const s=doc.splitTextToSize(String(t??''),w-10)[0]||'';if(al==='r')doc.text(s,x+w-5,y,{align:'right'});else doc.text(s,x+5,y);}
function pdfTable(doc,y,cols,rows,foot){const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();const tw=W-80;const tot=sum(cols,c=>c.w||1);const ws=cols.map(c=>(c.w||1)/tot*tw);
  const head=()=>{doc.setFillColor(240,236,252);doc.rect(40,y,tw,20,'F');doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(27,32,29);let x=40;cols.forEach((c,i)=>{pdfCell(doc,c.h,x,y+13,ws[i],c.r?'r':'');x+=ws[i];});y+=20;};
  head();const line=(r,bold)=>{if(y>H-60){doc.addPage();y=40;head();}doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(8.5);doc.setTextColor(27,32,29);let x=40;r.forEach((v,i)=>{pdfCell(doc,v,x,y+13,ws[i],cols[i].r?'r':'');x+=ws[i];});doc.setDrawColor(221,224,216);doc.line(40,y+19,40+tw,y+19);y+=19;};
  rows.forEach(r=>line(r,false));if(foot)line(foot,true);return y+14;}
function pdfSection(doc,y,t){const H=doc.internal.pageSize.getHeight();if(y>H-100){doc.addPage();y=48;}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(27,32,29);doc.text(t,40,y);return y+10;}
function tableReport(name,title,sub,cols,rows,foot,orient='p'){const doc=pdfDoc(orient);let y=pdfHeader(doc,title,sub);pdfTable(doc,y,cols,rows,foot);savePdf(doc,name);}

    return tableReport(`Project-margins-${stamp}.pdf`,'Project margins',`As of ${fmtD(TODAY)} · actual cost = hours logged × rate card + project costs`,head.map((h,i)=>({h,w:i<2?2:1.2,r:i>=2})),body.map(r=>r.map((v,i)=>i===2||i===3||i===5?(v===''?'—':inrP(v)):i===4||i===6?(v===''?'—':v+'%'):v)),null,'l');}
  if(what==='register'){const mk=S.ui.pm||TODAY.slice(0,7);return saveCsv(`Salary-register-${mk}.csv`,['Code','Name','Designation','Bank','Account','IFSC','Basic','HRA','Special','Other','Bonus','Reimbursements','Gross earnings','LOP days','LOP amount','Advance recovery','Other deductions','Net pay'],payEmps(mk).map(e=>{const c=payCalc(e,mk);return[e.code,e.name,desig(e.designationId)?.title,e.bank.name,e.bank.acct,e.bank.ifsc,c.s.basic,c.s.hra,c.s.special,c.s.other,c.bonus,c.reimb,c.earnings,c.lopDays,c.lopAmt,c.adv,c.otherDed,c.net];}));}
}
function costSheetPdf(q){const c=estCalc(q);const doc=pdfDoc();const W=doc.internal.pageSize.getWidth();let y=pdfHeader(doc,'Internal cost sheet',`${q.title||'Untitled'} · ${q.client||'No client'} · ${fmtD(q.created)}`);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(190,18,60);doc.text('INTERNAL – DO NOT SEND TO THE CLIENT',W-40,106,{align:'right'});
  y=pdfSection(doc,y,'Team effort');y=pdfTable(doc,y,[{h:'Role',w:2.4},{h:'People',w:.8,r:1},{h:'Days',w:.8,r:1},{h:'Cost / day',w:1.2,r:1},{h:'Amount',w:1.3,r:1}],q.labour.map(l=>[desig(l.role)?.title||'—',l.people,l.days,inrP(l.rate),inrP(l.people*l.days*l.rate)]),['Total','','','',inrP(c.labour)]);
  if(q.costs.length){y=pdfSection(doc,y,'Other costs');y=pdfTable(doc,y,[{h:'Category',w:1.4},{h:'Description',w:2.8},{h:'Qty',w:.7,r:1},{h:'Unit cost',w:1.1,r:1},{h:'Amount',w:1.2,r:1}],q.costs.map(x=>[x.cat,x.desc,x.qty,inrP(x.unit),inrP(x.qty*x.unit)]),['Total','','','',inrP(c.other)]);}
  y=pdfSection(doc,y,'Price');pdfTable(doc,y,[{h:'',w:3},{h:'Amount',w:1.3,r:1}],[['Team cost',inrP(c.labour)],['Other costs',inrP(c.other)],[`Contingency (${q.contingency}%)`,inrP(c.cont)],['Total internal cost',inrP(c.cost)],['Quote price',inrP(c.price)],['Profit',inrP(c.profit)],['Margin on price',pct(c.margin)],['Markup on cost',pct(c.markup)],[`Lowest price at ${MIN_MARGIN}% margin`,inrP(c.floor)]]);
  savePdf(doc,`Cost-sheet-${(q.title||'estimate').replace(/[^\w]+/g,'-').slice(0,40)}.pdf`);}
function proposalPdf(q){const c=estCalc(q);const doc=pdfDoc();const W=doc.internal.pageSize.getWidth();const ev=evById(q.eventId);let y=pdfHeader(doc,'Proposal',`${q.title||''} · ${fmtD(TODAY)} · valid for ${q.validity} days`);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(91,93,123);doc.text('PREPARED FOR',40,y);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20,21,42);doc.text(q.client||'—',40,y+15);if(ev){doc.setFontSize(9.5);doc.setTextColor(91,93,123);doc.text(`${ev.name} · ${fmtD(ev.start)} – ${fmtD(ev.end)}${ev.city?' · '+ev.city:''}`,40,y+30);}y+=52;
  if(q.scope){y=pdfSection(doc,y,'Scope of work');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(20,21,42);const ls=doc.splitTextToSize(q.scope,W-80);doc.text(ls,40,y+6);y+=ls.length*13+20;}
  y=pdfSection(doc,y,'Investment');y=pdfTable(doc,y,[{h:'Description',w:4},{h:'Amount',w:1.3,r:1}],[[q.title||'Project fee',inrP(c.price)]],['Total',inrP(c.price)]);
  doc.setFontSize(9);doc.setTextColor(91,93,123);doc.text(`Rupees ${words(c.price)} only`,40,y-4);y+=12;
  const rows=termRows(q.terms,TODAY,ev?ev.end:addDays(TODAY,45));const am=splitAmounts(c.price,rows.map(r=>r[1]));
  y=pdfSection(doc,y,'Payment terms');y=pdfTable(doc,y,[{h:'Stage',w:3},{h:'Share',w:1,r:1},{h:'Amount',w:1.3,r:1}],rows.map((r,i)=>[r[0],r[1]+'%',inrP(am[i])]));
  doc.setFontSize(9);doc.setTextColor(91,93,123);doc.text(`This proposal is valid for ${q.validity} days from ${fmtD(TODAY)}.`,40,y);
  savePdf(doc,`Proposal-${(q.client||'client').replace(/[^\w]+/g,'-').slice(0,30)}-${TODAY}.pdf`);}
function invoicePdf(id){const x=findItem(id);if(!x)return;const {s,p}=x;const c=client(p.clientId);const doc=pdfDoc();const W=doc.internal.pageSize.getWidth();let y=pdfHeader(doc,'Invoice '+s.invoice,`Issued ${fmtD(s.due<=TODAY?s.due:TODAY)} · Due ${fmtD(s.due)} · ${istatus(s)}`);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(91,100,93);doc.text('BILL TO',40,y);doc.setFont('helvetica','normal');doc.setTextColor(27,32,29);doc.setFontSize(10);doc.text([c.name,c.contact||'',c.email||'',c.phone||''].filter(Boolean),40,y+14);y+=80;
  y=pdfTable(doc,y,[{h:'Description',w:4},{h:'Project',w:2},{h:'Amount',w:1.3,r:1}],[[s.label,`${p.name} (${p.code})`,inrP(s.amount)],...(s.paid?[['Received so far','',inrP(-s.paid)]]:[])],['Balance due','',inrP(bal(s))]);
  doc.setFontSize(9);doc.setTextColor(91,100,93);doc.text(`Amount in words: Rupees ${words(s.amount)} only`,40,y);y+=24;doc.text('Bank details and payment terms go here in the full version.',40,y);if(s.paidOn){doc.setTextColor(43,122,75);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(`PAID on ${fmtD(s.paidOn)}`,W-40,y,{align:'right'});}
  savePdf(doc,`${s.invoice}.pdf`);}
function drawPayslip(doc,e,mk,tpl){
  const W=doc.internal.pageSize.getWidth();const d=slipData(e,mk);const co=C();const ACC=[124,58,237],BAND=[13,14,28],INK=[20,21,42],MUT=[91,93,123],LINE=[226,226,239],SOFT=[241,235,254];const bo=brandOnly();
  let y;
  if(tpl==='modern'){doc.setFillColor(...BAND);doc.rect(0,0,W,100,'F');doc.setFillColor(...ACC);doc.rect(0,100,W,3,'F');let lw;if(co.logo){doc.setFillColor(255,255,255);doc.roundedRect(38,26,48,48,5,5,'F');lw=addLogo(doc,42,30,40)+4;}else lw=addLogo(doc,40,28,44,true);const tx=40+lw+14;doc.setTextColor(255,255,255);if(!bo){doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(co.name,tx,48);}doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(co.address.replace(/\n/g,', '),tx,bo?54:63,{maxWidth:W-tx-150});doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('PAYSLIP',W-40,50,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(monthLabel(mk),W-40,67,{align:'right'});y=128;}
  else if(tpl==='classic'){doc.setDrawColor(...INK);doc.setLineWidth(1.5);doc.rect(28,28,W-56,doc.internal.pageSize.getHeight()-80);doc.setLineWidth(.5);const lw=addLogo(doc,44,42,44);const tx=44+lw+12;doc.setTextColor(...INK);if(!bo){doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(co.name,tx,60);}doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(co.address.replace(/\n/g,', '),tx,bo?66:74,{maxWidth:W-tx-140});doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('PAYSLIP',W-44,58,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(monthLabel(mk),W-44,74,{align:'right'});doc.setLineWidth(1.2);doc.line(40,100,W-40,100);doc.setLineWidth(.5);y=124;}
  else{const cw=bo?32*560/268:32;addLogo(doc,W-40-cw,30,32);doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(co.name,40,46);doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...MUT);doc.text('Payslip · '+monthLabel(mk),40,62);doc.setDrawColor(...ACC);doc.setLineWidth(1.5);doc.line(40,76,W-40,76);doc.setLineWidth(.5);y=98;}
  // details
  const colW=(W-80-24)/2;const det=(list,x)=>{let yy=y;list.forEach(([l,v])=>{doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(l,x,yy);doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.text(String(v),x+colW,yy,{align:'right'});doc.setDrawColor(...LINE);doc.line(x,yy+5,x+colW,yy+5);yy+=17;});return yy;};
  det(d.det,40);y=det(d.det2,40+colW+24)+14;
  // tables
  const tw=(W-80-16)/2;const tbl=(x,title,rows,total)=>{let yy=y;if(tpl==='modern'){doc.setFillColor(...SOFT);doc.rect(x,yy,tw,20,'F');}else{doc.setDrawColor(...INK);doc.line(x,yy,x+tw,yy);doc.line(x,yy+20,x+tw,yy+20);}
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...INK);doc.text(title.toUpperCase(),x+6,yy+13);doc.text('AMOUNT',x+tw-6,yy+13,{align:'right'});yy+=20;
    rows.forEach(([l,v])=>{doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(l,x+6,yy+13);doc.text(inrP(v),x+tw-6,yy+13,{align:'right'});doc.setDrawColor(...LINE);doc.line(x,yy+19,x+tw,yy+19);yy+=19;});return yy;};
  const y1=tbl(40,'Earnings',d.earn),y2=tbl(40+tw+16,'Deductions',d.ded);let yy=Math.max(y1,y2);
  doc.setDrawColor(...INK);doc.setLineWidth(1);doc.line(40,yy,40+tw,yy);doc.line(56+tw,yy,56+tw*2,yy);doc.setLineWidth(.5);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Total earnings',46,yy+14);doc.text(inrP(d.c.earnings),34+tw,yy+14,{align:'right'});doc.text('Total deductions',62+tw,yy+14);doc.text(inrP(d.c.deductions),W-46,yy+14,{align:'right'});
  y=yy+34;
  // net
  if(tpl==='modern'){doc.setFillColor(...SOFT);doc.roundedRect(40,y,W-80,52,5,5,'F');}else if(tpl==='classic'){doc.setDrawColor(...INK);doc.setLineWidth(1.2);doc.rect(40,y,W-80,52);doc.setLineWidth(.5);}else{doc.setDrawColor(...ACC);doc.setLineWidth(1.5);doc.line(40,y,W-40,y);doc.setLineWidth(.5);}
  doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Net pay',52,y+22);doc.setFontSize(16);doc.text(inrP(d.c.net),W-52,y+28,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(`Rupees ${words(d.c.net)} only`,52,y+38,{maxWidth:W-260});
  y+=80;doc.setFontSize(8);doc.text('This is a computer-generated payslip and does not need a signature.',W/2,y,{align:'center'});doc.text([co.email,co.phone].filter(Boolean).join(' · ')||' ',W/2,y+12,{align:'center'});
}
